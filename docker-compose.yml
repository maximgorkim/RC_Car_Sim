services:
  rc_sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rc_sim:humble
    container_name: rc_sim
    # Workspace root must be named bfmc_sim: launch files under
    # src/sim_pkg/launch hardcode paths via ~/bfmc_sim/...
    volumes:
      - .:/root/bfmc_sim
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # Host networking makes ROS2/DDS discovery and Gazebo transport behave
    # exactly like running natively - no port mapping needed.
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
