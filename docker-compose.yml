services:
  rc_sim:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: rc_sim:humble
    container_name: rc_sim

    volumes:
      - .:/root/bfmc_sim
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4

    network_mode: host
    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    stdin_open: true
    tty: true

    command: sleep infinity